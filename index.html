<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Party Corner — Tipi Party & Pyjama Party pour enfants</title>
<meta name="description" content="Anniversaires pyjama clés en main, installés directement chez vous. Tipis, thèmes, packs premium et animations sur devis.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --teal:#1f6b6b;
    --teal-dark:#123f3f;
    --teal-light:#e4efee;
    --coral:#d98a8a;
    --coral-dark:#c06b6b;
    --gold:#c9a04e;
    --gold-light:#e9d6a8;
    --cream:#fbf5ea;
    --cream-2:#f4e9d6;
    --ink:#2a2a33;
    --ink-soft:#5b5a63;
    --white:#fffdf8;
    --radius-lg: 28px 8px 28px 8px;
    --radius-md: 20px 6px 20px 6px;
    --shadow-soft: 0 18px 40px -18px rgba(20,45,45,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ margin:0; font-family:'Work Sans', sans-serif; color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; margin:0 0 .4em 0; font-weight:600; line-height:1.08; letter-spacing:-0.01em; }
  p{ line-height:1.65; color:var(--ink-soft); margin:0 0 1em 0;}
  a{ color:inherit; }
  img{max-width:100%; display:block;}
  .wrap{ max-width:1160px; margin:0 auto; padding:0 28px; }
  section{ position:relative; }

  .dot{ position:absolute; border-radius:50%; }

  header{ position:sticky; top:0; z-index:50; background:rgba(251,245,234,0.92); backdrop-filter: blur(8px); border-bottom:1px solid rgba(31,107,107,0.12); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 28px; max-width:1160px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand-text .name{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; color:var(--teal-dark); }
  .brand-text .tag{ font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--coral-dark); }
  nav.links{ display:flex; align-items:center; gap:22px; }
  nav.links a{ text-decoration:none; font-size:.88rem; font-weight:500; color:var(--ink); position:relative; padding:4px 0; white-space:nowrap; }
  nav.links a::after{ content:""; position:absolute; left:0; bottom:-2px; width:0; height:2px; background:var(--coral); transition:width .25s ease; }
  nav.links a:hover::after{ width:100%; }
  .btn{ display:inline-flex; align-items:center; gap:8px; font-family:'Work Sans', sans-serif; font-weight:600; font-size:.9rem; padding:12px 24px; border-radius:999px; text-decoration:none; border:2px solid transparent; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; }
  .btn-primary{ background:var(--teal); color:var(--white); box-shadow:var(--shadow-soft); }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-outline{ background:transparent; border-color:var(--teal); color:var(--teal-dark); }
  .btn-outline:hover{ background:var(--teal); color:var(--white); }
  .btn-gold{ background:var(--gold); color:var(--teal-dark); box-shadow:var(--shadow-soft); }
  .btn-gold:hover{ transform:translateY(-2px); }
  .btn-lg{ padding:16px 34px; font-size:1rem; }
  .nav-cta{ display:flex; }
  .burger{ display:none; background:none; border:none; cursor:pointer; }
  .burger span{ display:block; width:26px; height:2px; background:var(--teal-dark); margin:5px 0; }
  .mobile-nav{ display:none; flex-direction:column; gap:2px; background:var(--white); border-top:1px solid rgba(31,107,107,0.12); }
  .mobile-nav.open{ display:flex; }
  .mobile-nav a{ padding:14px 28px; text-decoration:none; color:var(--ink); font-weight:500; border-bottom:1px solid rgba(31,107,107,0.06); }

  /* hero */
  .hero{ padding:64px 0 90px; position:relative; overflow:hidden; background: radial-gradient(circle at 85% 10%, rgba(201,160,78,0.16), transparent 55%), radial-gradient(circle at 8% 85%, rgba(217,138,138,0.16), transparent 45%); }
  .hero-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:50px; align-items:center; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:.76rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--coral-dark); background:rgba(217,138,138,0.14); padding:7px 16px; border-radius:999px; margin-bottom:16px; }
  .hero h1{ font-size:clamp(2rem, 3.6vw, 3rem); color:var(--teal-dark); }
  .hero .accroche{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:1.15rem; color:var(--coral-dark); margin:10px 0 18px; }
  .hero p.lead{ font-size:1.02rem; max-width:520px; margin-bottom:26px; }
  .hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; }
  .hero-photo{ position:relative; border-radius: var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-soft); }
  .hero-photo img{ width:100%; height:420px; object-fit:cover; }
  .hero-photo .cap{ position:absolute; left:16px; bottom:16px; background:rgba(18,63,63,0.85); color:var(--white); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:8px 14px; border-radius:999px; }

  .section-head{ text-align:center; max-width:640px; margin:0 auto 40px; }
  .section-head .kicker{ color:var(--coral-dark); font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:.74rem; }
  .section-head h2{ color:var(--teal-dark); font-size:clamp(1.6rem,3vw,2.3rem); }
  .section-head.left{ text-align:left; margin:0 0 34px; }

  /* pack essentiel */
  .essentiel{ padding:80px 0; background:var(--white); }
  .essentiel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center; }
  .essentiel-photo{ border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-soft); }
  .essentiel-photo img{ width:100%; height:380px; object-fit:cover; }
  .badge{ display:inline-block; background:var(--coral); color:var(--white); font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 12px; border-radius:999px; margin-bottom:14px; }
  .check-list{ list-style:none; margin:18px 0 24px; padding:0; display:grid; gap:10px; }
  .check-list li{ display:flex; align-items:flex-start; gap:10px; font-size:.95rem; color:var(--ink); }
  .check-list li svg{ flex:0 0 auto; margin-top:3px; }
  .theme-chip-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .theme-chip{ background:var(--teal-light); color:var(--teal-dark); font-size:.86rem; font-weight:600; padding:8px 16px; border-radius:999px; }

  /* premium packs */
  .premium{ padding:80px 0; background:var(--cream-2); }
  .premium-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .premium-card{ background:var(--white); border-radius:var(--radius-md); overflow:hidden; box-shadow:0 14px 30px -18px rgba(20,45,45,0.25); transition:transform .25s ease, box-shadow .25s ease; display:flex; flex-direction:column; }
  .premium-card:hover{ transform:translateY(-6px); box-shadow:0 22px 40px -18px rgba(20,45,45,0.35); }
  .premium-card img{ width:100%; height:150px; object-fit:cover; }
  .premium-body{ padding:20px 18px 24px; flex:1; display:flex; flex-direction:column; }
  .premium-body h3{ font-size:1.05rem; color:var(--teal-dark); margin-bottom:8px; }
  .premium-body ul{ list-style:none; padding:0; margin:0 0 14px; display:grid; gap:6px; flex:1; }
  .premium-body ul li{ font-size:.85rem; color:var(--ink-soft); display:flex; gap:6px; }
  .premium-body ul li::before{ content:"+"; color:var(--gold); font-weight:700; }
  .premium-tag{ font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--coral-dark); margin-bottom:6px; }

  /* options */
  .options{ padding:80px 0; background:var(--white); }
  .option-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .option-card{ padding:20px 18px; border-radius:var(--radius-md); background:var(--cream); border:1px solid rgba(31,107,107,0.1); text-align:center; }
  .option-card .price{ font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; color:var(--teal-dark); margin:6px 0 4px; }
  .option-card .name{ font-size:.86rem; color:var(--ink); font-weight:500; }
  .option-card .unit{ font-size:.72rem; color:var(--ink-soft); }

  /* formules pricing table */
  .formules{ padding:80px 0; background:var(--teal-dark); color:var(--white); }
  .formules .section-head .kicker{ color:var(--gold-light); }
  .formules .section-head h2{ color:var(--white); }
  .formules .section-head p{ color:rgba(255,253,248,0.78); }
  .price-table{ width:100%; border-collapse:separate; border-spacing:0 10px; }
  .price-table th{ text-align:left; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-light); padding:0 20px 8px; font-weight:600; }
  .price-table td{ background:rgba(255,253,248,0.06); padding:16px 20px; font-size:.98rem; }
  .price-table tr td:first-child{ border-radius:14px 0 0 14px; font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; }
  .price-table tr td:last-child{ border-radius:0 14px 14px 0; text-align:right; font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:var(--gold-light); }
  .price-table tr:hover td{ background:rgba(255,253,248,0.12); }
  .price-note{ font-size:.82rem; color:rgba(255,253,248,0.65); margin-top:10px; }
  .delivery-box{ margin-top:36px; background:rgba(255,253,248,0.08); border:1px solid rgba(255,253,248,0.15); border-radius:var(--radius-md); padding:24px 28px; display:flex; gap:34px; flex-wrap:wrap; }
  .delivery-box div{ flex:1; min-width:220px; }
  .delivery-box strong{ display:block; color:var(--gold-light); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .delivery-box span{ font-size:.94rem; color:rgba(255,253,248,0.9); }

  /* booking steps */
  .booking{ padding:80px 0; background:var(--cream); }
  .booking-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .booking-step{ padding:26px 22px; background:var(--white); border-radius:var(--radius-md); border:1px solid rgba(31,107,107,0.1); }
  .booking-step .num{ width:36px; height:36px; border-radius:50%; background:var(--teal); color:var(--white); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; margin-bottom:14px; }
  .booking-step h3{ font-size:1rem; color:var(--teal-dark); margin-bottom:6px; }
  .booking-step p{ font-size:.88rem; margin:0; }

  /* gallery */
  .gallery{ padding:80px 0; background:var(--white); }
  .gallery-grid{ display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:170px; gap:14px; }
  .gallery-grid > div{ border-radius:16px; overflow:hidden; }
  .gallery-grid img{ width:100%; height:100%; object-fit:cover; }
  .gallery-grid > div:nth-child(1){ grid-column:span 2; grid-row:span 2; }
  .gallery-placeholder{ height:100%; width:100%; background: repeating-linear-gradient(135deg, rgba(31,107,107,0.08) 0 10px, rgba(31,107,107,0.03) 10px 20px), var(--cream); border:1.5px dashed rgba(31,107,107,0.35); display:flex; align-items:center; justify-content:center; text-align:center; color:var(--teal-dark); font-size:.76rem; font-weight:600; letter-spacing:.04em; padding:10px; }

  /* FAQ */
  .faq{ padding:80px 0; background:var(--white); }
  .faq-list{ max-width:760px; margin:0 auto; display:grid; gap:12px; }
  .faq-item{ background:var(--cream); border-radius:16px; border:1px solid rgba(31,107,107,0.1); overflow:hidden; }
  .faq-item summary{ cursor:pointer; padding:18px 22px; font-weight:600; color:var(--teal-dark); list-style:none; display:flex; justify-content:space-between; align-items:center; font-size:.98rem; }
  .faq-item summary::-webkit-details-marker{ display:none; }
  .faq-item summary::after{ content:"+"; font-size:1.3rem; color:var(--gold); font-weight:400; }
  .faq-item[open] summary::after{ content:"–"; }
  .faq-item .faq-a{ padding:0 22px 20px; font-size:.9rem; color:var(--ink-soft); }

  /* final CTA */
  .cta-banner{ padding:70px 0; background:linear-gradient(135deg, var(--teal-dark), var(--teal)); color:var(--white); text-align:center; }
  .cta-banner h2{ color:var(--white); font-size:clamp(1.6rem,3vw,2.4rem); }
  .cta-banner p{ color:rgba(255,253,248,0.82); max-width:480px; margin:0 auto 26px; }

  /* contact */
  .contact{ padding:80px 0 100px; background:var(--cream); }
  .contact-grid{ display:grid; grid-template-columns:.85fr 1.15fr; gap:50px; }
  .contact-info h2{ color:var(--teal-dark); font-size:clamp(1.6rem,3vw,2.1rem); }
  .info-list{ list-style:none; padding:0; margin:22px 0; display:grid; gap:16px; }
  .info-list li{ display:flex; gap:14px; align-items:flex-start; }
  .info-list .ico{ width:38px; height:38px; border-radius:50%; background:var(--teal); color:var(--white); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .info-list strong{ display:block; font-size:.76rem; text-transform:uppercase; letter-spacing:.08em; color:var(--coral-dark); }
  .info-list span{ font-size:.94rem; color:var(--ink); }
  .placeholder-txt{ color:#b04a4a; font-style:italic; }
  .form-card{ background:var(--white); border-radius:var(--radius-lg); padding:34px; box-shadow:var(--shadow-soft); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.8rem; font-weight:600; margin-bottom:6px; color:var(--teal-dark); }
  .field input, .field select, .field textarea{ width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid rgba(31,107,107,0.25); font-family:'Work Sans',sans-serif; font-size:.92rem; background:var(--cream); color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal); }
  .field textarea{ resize:vertical; min-height:90px; }
  .form-submit{ width:100%; justify-content:center; margin-top:6px; }
  .form-note{ font-size:.76rem; color:var(--ink-soft); margin-top:10px; text-align:center; }

  footer{ background:var(--teal-dark); color:rgba(255,253,248,0.85); padding:46px 0 24px; }
  .footer-grid{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:28px; margin-bottom:30px; }
  .footer-brand{ display:flex; align-items:center; gap:12px; }
  .footer-brand .name{ font-family:'Fraunces',serif; font-weight:600; color:var(--white); }
  .footer-links{ display:flex; gap:34px; flex-wrap:wrap; }
  .footer-links div strong{ display:block; font-size:.74rem; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-light); margin-bottom:10px; }
  .footer-links a{ display:block; text-decoration:none; color:rgba(255,253,248,0.78); font-size:.88rem; margin-bottom:8px; }
  .footer-links a:hover{ color:var(--white); }
  .footer-bottom{ border-top:1px solid rgba(255,253,248,0.15); padding-top:18px; font-size:.78rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; color:rgba(255,253,248,0.6); }

  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.show{ opacity:1; transform:translateY(0); }

  @media (max-width: 980px){
    .hero-grid, .essentiel-grid{ grid-template-columns:1fr; }
    .hero-photo img, .essentiel-photo img{ height:280px; }
    .premium-grid, .option-grid, .booking-grid{ grid-template-columns:repeat(2,1fr); }
    .contact-grid{ grid-template-columns:1fr; }
    .gallery-grid{ grid-template-columns:repeat(2,1fr); }
    .gallery-grid > div:nth-child(1){ grid-column:span 2; grid-row:span 1; height:220px;}
    nav.links{ display:none; }
    .burger{ display:block; }
    .delivery-box{ flex-direction:column; gap:16px; }
  }
  @media (max-width: 640px){
    .form-row{ grid-template-columns:1fr; }
    .premium-grid, .option-grid, .booking-grid{ grid-template-columns:1fr; }
  }

  /* lightbox */
  .gallery-grid img{ cursor:zoom-in; transition: transform .25s ease; }
  .gallery-grid img:hover{ transform: scale(1.03); }
  .lightbox{ position:fixed; inset:0; background:rgba(18,20,20,0.92); display:none; align-items:center; justify-content:center; z-index:999; padding:24px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:92vw; max-height:88vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .lightbox-close{ position:absolute; top:20px; right:28px; color:#fff; font-size:2.2rem; line-height:1; background:none; border:none; cursor:pointer; }
  .lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.12); border:none; color:#fff; font-size:1.8rem; width:48px; height:48px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lightbox-prev{ left:20px; }
  .lightbox-next{ right:20px; }

</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="#accueil">
      <svg width="38" height="38" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex:0 0 auto;">
        <path d="M32 6 L58 58 H6 Z" stroke="#1f6b6b" stroke-width="3" stroke-linejoin="round"/>
        <path d="M20 16 L44 50" stroke="#c9a04e" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 16 L20 50" stroke="#d98a8a" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <span class="name">The Party Corner</span>
      </div>
    </a>
    <nav class="links">
      <a href="#essentiel">Pack Essentiel</a>
      <a href="#premium">Premium</a>
      <a href="#options">Options</a>
      <a href="#formules">Formules</a>
      <a href="#galerie">Galerie</a>
      <a href="#faq">FAQ</a>
    </nav>
    <div class="nav-cta">
      <a href="#contact" class="btn btn-primary">Réserver ma Tipi Party</a>
    </div>
    <button class="burger" id="burger" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a href="#essentiel">Pack Essentiel</a>
    <a href="#premium">Premium</a>
    <a href="#options">Options</a>
    <a href="#formules">Formules</a>
    <a href="#galerie">Galerie</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">Réserver</a>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero" id="accueil">
  <div class="dot" style="width:14px;height:14px;background:var(--coral);top:14%;left:4%;"></div>
  <div class="dot" style="width:9px;height:9px;background:var(--gold);top:75%;left:2%;"></div>
  <div class="wrap hero-grid">
    <div>
      <h1>Parce que les plus beaux souvenirs commencent souvent à la maison</h1>
      <p class="accroche">Transformez une simple soirée en une aventure magique.</p>
      <p class="lead">Nos Tipi Party métamorphosent votre intérieur en un univers féerique où les rires, les confidences et les étoiles plein les yeux deviennent des souvenirs inoubliables. Vous choisissez le thème, nous nous occupons du reste.</p>
      <div class="hero-ctas">
        <a href="#contact" class="btn btn-primary btn-lg">Réserver ma Tipi Party</a>
        <a href="#formules" class="btn btn-outline">Voir les formules & tarifs</a>
      </div>
    </div>
    <div class="hero-photo">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3DlOPVdSQVUvq9lMAQ2BSDaFO5J/hf_20260805_183115_ff07e9f0-3343-4689-9b51-29a72e150598.png" alt="Ambiance Tipi Party The Party Corner">
      <span class="cap">Visuel d'ambiance — à remplacer par tes photos</span>
    </div>
  </div>
</section>

<!-- ================= PACK ESSENTIEL ================= -->
<section class="essentiel reveal" id="essentiel">
  <div class="wrap essentiel-grid">
    <div class="essentiel-photo">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3DlOPVdSQVUvq9lMAQ2BSDaFO5J/hf_20260805_183115_20158d36-09ad-4633-b5c7-c4fc3d879617.png" alt="Pack Essentiel Tipi Party">
    </div>
    <div>
      <span class="badge">La base de chaque Tipi Party</span>
      <h2>Pack Essentiel</h2>
      <p>Tout ce qu'il faut pour une nuit sous tipi réussie, installé et repris directement chez vous.</p>

<script>
  const burger = document.getElementById('burger');
  const mobileNav = document.getElementById('mobileNav');
  burger.addEventListener('click', () => mobileNav.classList.toggle('open'));
  mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileNav.classList.remove('open')));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('show'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>


<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Precedent">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Suivant">&#8250;</button>
</div>
<script>
  (function(){
    const galleryImgs = Array.from(document.querySelectorAll('.gallery-grid img'));
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    let currentIndex = 0;
    function openLightbox(i){
      currentIndex = i;
      lightboxImg.src = galleryImgs[i].src;
      lightboxImg.alt = galleryImgs[i].alt || '';
      lightbox.classList.add('open');
    }
    function closeLightbox(){ lightbox.classList.remove('open'); }
    function showNext(){ currentIndex = (currentIndex + 1) % galleryImgs.length; openLightbox(currentIndex); }
    function showPrev(){ currentIndex = (currentIndex - 1 + galleryImgs.length) % galleryImgs.length; openLightbox(currentIndex); }
    galleryImgs.forEach((img, i) => img.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxNext').addEventListener('click', showNext);
    document.getElementById('lightboxPrev').addEventListener('click', showPrev);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });
  })();
</script>
